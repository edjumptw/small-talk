<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英語練習手冊｜日常社交 + 多益商務</title>
<meta name="description" content="兩區並存的英語練習手冊：日常社交 Small Talk 100 句、多益商務情境 100 句。可搜尋、可朗讀、可遮蔽自測、可收藏。">
<style>
  :root{
    --bg:#f7f6f3; --card:#ffffff; --ink:#1f1d1a; --ink-soft:#5c5852;
    --line:#e5e1da; --accent:#8a5a2b; --accent-soft:#f3e9dd; --en:#1a3a5c;
    --star:#d99b2b; --star-off:#cdc6bb; --shadow:0 1px 3px rgba(31,29,26,.07);
    --tab2:#2f6f6b; --tab2-soft:#e4efed;
  }
  html[data-theme="dark"]{
    --bg:#171614; --card:#242220; --ink:#ece7df; --ink-soft:#a49c92;
    --line:#38352f; --accent:#c8955a; --accent-soft:#33291d; --en:#8fc0e8;
    --star:#e8b45a; --star-off:#57514a; --shadow:0 1px 3px rgba(0,0,0,.4);
    --tab2:#6fbfb7; --tab2-soft:#1e3230;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Sans GB","Microsoft JhengHei",sans-serif;
    line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 90px;}

  header{padding:44px 0 20px;}
  h1{font-size:30px;margin:0 0 6px;letter-spacing:.5px;}
  .sub{color:var(--ink-soft);font-size:15px;}

  .tabs{display:flex;gap:8px;padding:18px 0 0;}
  .tab{
    flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    border-radius:12px 12px 0 0;padding:13px 10px;font-size:15.5px;cursor:pointer;
    font-family:inherit;font-weight:600;transition:.15s;border-bottom:0;
  }
  .tab .n{display:block;font-size:12.5px;font-weight:400;opacity:.8;margin-top:1px;}
  .tab:hover{color:var(--accent);}
  .tab.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  body[data-tab="toeic"] .tab.on{background:var(--tab2-soft);color:var(--tab2);border-color:var(--tab2);}

  .bar{
    position:sticky;top:0;z-index:20;
    background:var(--bg);padding:12px 0 10px;
    border-top:3px solid var(--accent);border-bottom:1px solid var(--line);margin-bottom:20px;
  }
  body[data-tab="toeic"] .bar{border-top-color:var(--tab2);}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .search{flex:1 1 220px;min-width:170px;position:relative;}
  .search input{
    width:100%;padding:11px 38px 11px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:15px;font-family:inherit;outline:none;
  }
  .search input:focus{border-color:var(--accent);}
  .search .clr{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:0;background:transparent;color:var(--ink-soft);font-size:19px;
    cursor:pointer;padding:2px 7px;line-height:1;display:none;
  }
  .search .clr.on{display:block;}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:9px;padding:9px 13px;font-size:14px;cursor:pointer;
    font-family:inherit;white-space:nowrap;transition:.15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn .cnt{opacity:.75;font-size:12.5px;}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:11px 0 2px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;font-family:inherit;
    transition:.15s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
  body[data-tab="toeic"] .chip:hover{border-color:var(--tab2);color:var(--tab2);}
  body[data-tab="toeic"] .chip.on{background:var(--tab2-soft);border-color:var(--tab2);color:var(--tab2);}

  .meta{color:var(--ink-soft);font-size:13.5px;margin:14px 0 4px;}

  h2{
    font-size:20px;margin:38px 0 4px;padding-left:12px;border-left:5px solid var(--accent);
    scroll-margin-top:130px;
  }
  body[data-tab="toeic"] h2{border-left-color:var(--tab2);}
  .note{color:var(--ink-soft);font-size:14px;margin:0 0 16px 17px;}
  .formula{background:var(--accent-soft);border-radius:12px;padding:18px 24px;margin:16px 0 6px;}
  body[data-tab="toeic"] .formula{background:var(--tab2-soft);}
  .formula p{margin:6px 0;}
  .formula b{color:var(--accent);}
  body[data-tab="toeic"] .formula b{color:var(--tab2);}
  ul.mine{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 16px 34px;margin:14px 0 0;}
  ul.mine li{margin:6px 0;}

  .scene{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 22px 14px;margin:16px 0;box-shadow:var(--shadow);}
  .item{padding:13px 0;border-bottom:1px dashed var(--line);}
  .item:last-child{border-bottom:0;}
  .top{display:flex;align-items:flex-start;gap:10px;}
  .say{
    flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--accent);
    border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;margin-top:2px;transition:.15s;
  }
  body[data-tab="toeic"] .say{color:var(--tab2);}
  .say:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .say.playing{background:var(--accent);color:#fff;border-color:var(--accent);}
  .say:disabled{opacity:.35;cursor:default;}
  .txt{flex:1 1 auto;min-width:0;}
  .en{color:var(--en);font-size:17px;font-weight:600;letter-spacing:.2px;}
  .zh{font-size:15px;margin-top:2px;}
  .tip{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}
  .tip b{color:var(--accent);font-weight:600;}
  body[data-tab="toeic"] .tip b{color:var(--tab2);}
  .star{
    flex:0 0 auto;border:0;background:transparent;cursor:pointer;font-size:19px;
    padding:2px 4px;line-height:1;color:var(--star-off);transition:.15s;margin-top:2px;
  }
  .star:hover{color:var(--star);}
  .star.on{color:var(--star);}
  .badge{
    display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;
    background:var(--accent-soft);color:var(--accent);vertical-align:2px;margin-right:6px;font-weight:600;
  }
  body[data-tab="toeic"] .badge{background:var(--tab2-soft);color:var(--tab2);}

  /* 語音與語速 */
  .vrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .vrow label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .vrow select{
    font:inherit;font-size:12.5px;padding:4px 8px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  }
  body[data-tab="toeic"] .vrow select:focus{border-color:var(--tab2);}
  .vrow select:focus{outline:none;border-color:var(--accent);}
  .vtip{font-size:11.5px;color:var(--ink-soft);margin-left:auto;}

  /* 自測模式 */
  .quiz .txt{cursor:pointer;}
  .quiz .zh, .quiz .tip{filter:blur(6px);user-select:none;transition:filter .18s;}
  .quiz .item.open .zh, .quiz .item.open .tip{filter:none;}
  .quiz .txt::after{
    content:"點一下看答案";display:block;font-size:12.5px;color:var(--ink-soft);
    margin-top:3px;letter-spacing:.5px;
  }
  .quiz .item.open .txt::after{content:"";}

  .bad{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 24px;margin-top:14px;box-shadow:var(--shadow);}
  .bad h3{margin:0 0 8px;font-size:17px;color:var(--accent);}
  body[data-tab="toeic"] .bad h3{color:var(--tab2);}
  .bad p{margin:6px 0;font-size:14.5px;}
  .bad .en{font-size:15px;}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px;}
  mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 1px;}
  html[data-theme="dark"] mark{background:#5a4a1e;color:#f5e6c0;}

  footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:13px;}

  @media (max-width:600px){
    .wrap{padding:0 14px 70px;}
    h1{font-size:24px;}
    header{padding:28px 0 14px;}
    .en{font-size:16px;}
    .scene{padding:4px 15px 12px;}
    .tab{font-size:14px;}
  }
  @media print{
    .bar,.say,.star,.search,.tabs{display:none !important;}
    body{background:#fff !important;}
    .wrap{max-width:100%;padding:0;}
    .scene{break-inside:auto;box-shadow:none;}
    .item{break-inside:avoid;}
    h2{break-after:avoid;}
    footer{display:none;}
    .quiz .zh,.quiz .tip{filter:none !important;}
    .quiz .txt::after{content:"" !important;}
  }
</style>
</head>

const SCENES = {
  social: [

    {t:"場景四：接待外商、帶客人參觀", note:"地主優勢：食物、天氣、行程都是你可以主導的話題。"},
    {t:"場景五：用餐與應酬", note:"食物是全世界最不會出錯的話題，記得把決定權丟給對方。"},
    {t:"場景六：稱讚別人與回應稱讚", note:"稱讚要具體、回應要接住。過度否認反而讓對方尷尬。"},
    {t:"場景七：接話與延續（這區最重要）", note:"聊不下去通常不是詞彙不夠，是少了「從對方回答裡抓一個點往下問」這一步。"},
    {t:"場景八：救冷場與轉話題", note:"冷場不用慌，轉得漂亮比硬撐有價值。"},
    {t:"場景九：優雅收尾", note:"Small Talk 有一半的本事在懂得結束。把理由放在自己身上最體貼。"},
    {t:"場景十：視訊、電話與遠距", note:"遠距少了肢體語言，開場與收尾的招呼語要更明確。"}
  ],
  toeic: [
    {t:"一、辦公室日常 Office", note:"多益最高頻的情境。考的是指令、時程、內部溝通，句子短、資訊密度高。"},
    {t:"二、會議 Meetings", note:"常考「誰說了什麼、結論是什麼、下一步做什麼」，動詞片語是關鍵。"},
    {t:"三、客戶往來與拜訪 Clients", note:"接待、報價、提案、維繫關係。注意禮貌層級與承諾用詞。"},
    {t:"四、出差與訂位 Travel", note:"訂票、訂房、改期、報帳。數字、時間、地點一定要聽清楚。"},
    {t:"五、訂單與出貨 Orders", note:"數量、單價、折扣、交期、缺貨。多益聽力很愛出「改了什麼」。"},
    {t:"六、客服與客訴 Customer Service", note:"道歉、查詢、補救方案。語氣一定是先安撫再解決。"},

    {t:"十、電話與視訊 Phone & Remote", note:"轉接、聽不清楚、回電、開擴音。多益愛考「他為什麼打來」。"}

{tab:'social',s:2,en:"Thanks for making the time — I know you're busy.",zh:"謝謝你撥空，我知道你很忙。",tip:"結束時說，體貼感很強。"},

{tab:'social',s:3,en:"Did you have a good flight?",zh:"飛機還順吧？",tip:"接機第一句，永遠安全。"},
{tab:'social',s:3,en:"Is this your first time in Taiwan?",zh:"第一次來台灣嗎？",tip:"對方答 yes 就順勢介紹；答 no 就問之前來做什麼。"},
{tab:'social',s:3,en:"How long are you staying?",zh:"這次停留幾天？",tip:"問行程不問私事，很得體。"},
{tab:'social',s:3,en:"Have you tried the food here yet?",zh:"這裡的食物你吃過了嗎？",tip:"台灣人最好發揮的話題，最容易聊開。"},
{tab:'social',s:3,en:"Let me know if you need anything at all.",zh:"有任何需要都跟我說。",tip:"接待方的標準款待句。"},
{tab:'social',s:3,en:"Can I get you something to drink?",zh:"要不要喝點什麼？",tip:"接待的基本動作。"},
{tab:'social',s:3,en:"How does it compare to back home?",zh:"跟你家鄉比起來如何？",tip:"很棒的第二層問題，能聊出文化差異。"},
{tab:'social',s:3,en:"Is there anything you'd like to see while you're here?",zh:"這趟有沒有特別想去看的地方？",tip:"表現地主之誼。"},
{tab:'social',s:3,en:"Let me show you around a bit.",zh:"我帶你稍微看一下環境。",tip:"自然帶動動線。"},
{tab:'social',s:3,en:"Hope you enjoy the rest of your stay.",zh:"祝你這趟剩餘的行程愉快。",tip:"送客收尾。"},

{tab:'social',s:4,en:"Have you been here before?",zh:"這家你來過嗎？",tip:"坐下來第一句。"},
{tab:'social',s:4,en:"What would you recommend?",zh:"有什麼推薦的嗎？",tip:"把決定權給對方，很受用。"},
{tab:'social',s:4,en:"This is a local specialty — you have to try it.",zh:"這是當地特色，你一定要試試。",tip:"介紹台灣菜時用。"},
{tab:'social',s:4,en:"Are you adventurous with food?",zh:"吃東西你敢嘗試嗎？",tip:"比「Do you like...?」有趣得多。"},
{tab:'social',s:4,en:"How's your dish?",zh:"你那道如何？",tip:"上菜後的自然話題。"},
{tab:'social',s:4,en:"Do you cook at all?",zh:"你自己會下廚嗎？",tip:"食物話題往下延伸的好句。"},
{tab:'social',s:4,en:"Let me top up your glass.",zh:"我幫你添一下。",tip:"斟酒添茶的道地說法。"},
{tab:'social',s:4,en:"I'll let you get back to your meal.",zh:"不打擾你用餐了。",tip:"打擾後的漂亮退場。"},
{tab:'social',s:4,en:"Shall we get the bill?",zh:"我們買單好嗎？",tip:"英式用 bill，美式常用 check。"},
{tab:'social',s:4,en:"That was a great meal — thanks for the recommendation.",zh:"這頓很棒，謝謝你推薦。",tip:"收尾感謝，留下好印象。"},

{tab:'social',s:5,en:"That was a great presentation.",zh:"你那場簡報很精采。",tip:"具體指名哪一件事，比泛泛說 good job 有力。"},
{tab:'social',s:5,en:"I really like how you handled that.",zh:"你處理那件事的方式我很欣賞。",tip:"稱讚做法不稱讚天賦，更專業。"},
{tab:'social',s:5,en:"You have a great eye for detail.",zh:"你對細節很有眼光。",tip:"職場讚美的高級句。"},
{tab:'social',s:5,en:"Your English is really impressive.",zh:"你英文真好。",tip:"收到這句時不要說「No no no」。"},
{tab:'social',s:5,en:"Thanks — I've been working on it.",zh:"謝啦，我一直在練。",tip:"[[回應稱讚的正解：]]謝過加一句補充，不要過度否認。"},
{tab:'social',s:5,en:"That's very kind of you to say.",zh:"你這麼說真好。",tip:"不知道怎麼回時的安全牌。"},
{tab:'social',s:5,en:"Thanks, that means a lot.",zh:"謝謝，這對我意義很大。",tip:"來自前輩或客戶時用。"},
{tab:'social',s:5,en:"It was a team effort, honestly.",zh:"說真的，那是團隊的功勞。",tip:"謙虛但不否定，比「沒有啦」得體。"},
{tab:'social',s:5,en:"I love your approach to this.",zh:"我很喜歡你處理這件事的角度。",tip:"對同儕用，不會顯得像在上對下。"},
{tab:'social',s:5,en:"You made that look easy.",zh:"你做起來好像很輕鬆。",tip:"輕鬆場合的讚美，很討喜。"},

{tab:'social',s:6,en:"Oh really? How was that?",zh:"真的嗎？如何啊？",tip:"萬能追問第一句，幾乎任何回答後都能接。"},
{tab:'social',s:6,en:"Tell me more about that.",zh:"再多說一點。",tip:"表現真有興趣，對方會很樂意講。"},
{tab:'social',s:6,en:"What happened after that?",zh:"後來呢？",tip:"故事型回答用這句最好。"},
{tab:'social',s:6,en:"That sounds interesting — where did you go?",zh:"聽起來不錯，你們去哪裡？",tip:"[[先回應再追問]]，這才是自然對話。"},
{tab:'social',s:6,en:"I know exactly what you mean.",zh:"我完全懂你在說什麼。",tip:"建立共鳴最有效。"},
{tab:'social',s:6,en:"Same here — I had a similar experience.",zh:"我也是，我有過類似經驗。",tip:"分享一點自己的，對話才會平衡。"},
{tab:'social',s:6,en:"Wait, how did you get into that?",zh:"等等，你怎麼開始做這個的？",tip:"問「怎麼開始的」永遠比問「做什麼」好聊。"},
{tab:'social',s:6,en:"No way. Seriously?",zh:"不會吧，認真的？",tip:"口語感強，熟一點的場合用。"},
{tab:'social',s:6,en:"That's a good point — I hadn't thought of it that way.",zh:"這點很好，我沒這樣想過。",tip:"商務場合的接話，顯得你有在聽。"},
{tab:'social',s:6,en:"What was the highlight for you?",zh:"對你來說最精采的是哪部分？",tip:"把開放式問題收斂一點，比較好答。"},

{tab:'social',s:7,en:"Anyway — how's everything on your end?",zh:"話說回來，你那邊一切還好嗎？",tip:"卡住時的萬用跳板。"},
{tab:'social',s:7,en:"Speaking of which, did you hear about...?",zh:"說到這個，你有聽說＿＿嗎？",tip:"從對方的關鍵字順勢轉向。"},
{tab:'social',s:7,en:"That reminds me — have you tried...?",zh:"這讓我想到，你有試過＿＿嗎？",tip:"轉得很自然，不生硬。"},
{tab:'social',s:7,en:"Sorry, I completely lost my train of thought.",zh:"抱歉，我剛完全斷線了。",tip:"腦袋空白時誠實講，比硬擠好。"},
{tab:'social',s:7,en:"Let me think about that for a second.",zh:"讓我想一下。",tip:"買時間用，不會顯得卡住。"},
{tab:'social',s:7,en:"I'm not the best person to ask, honestly.",zh:"說真的，問我不是最佳人選。",tip:"不懂的話題可以這樣卸掉。"},
{tab:'social',s:7,en:"We'll have to agree to disagree.",zh:"這點我們就各自保留吧。",tip:"意見不合時的和緩收場，非常重要。"},
{tab:'social',s:7,en:"Let's park that for now.",zh:"這個先放著。",tip:"會議上擱置爭議的道地說法。"},
{tab:'social',s:7,en:"Where were we?",zh:"我們剛講到哪？",tip:"岔題後拉回來。"},
{tab:'social',s:7,en:"Do you mind if I switch topics for a second?",zh:"介意我換個話題嗎？",tip:"要轉進正事時很有禮貌。"},

{tab:'social',s:8,en:"It was really nice talking to you.",zh:"很高興跟你聊。",tip:"最基本也最不會錯。"},
{tab:'social',s:8,en:"I should let you go — I know you're busy.",zh:"不打擾你了，我知道你忙。",tip:"把結束的理由放在自己身上，最體貼。"},
{tab:'social',s:8,en:"I don't want to keep you.",zh:"不想佔用你太多時間。",tip:"非常常用的退場句。"},
{tab:'social',s:8,en:"Let's catch up again soon.",zh:"找時間再聊。",tip:"catch up 是「敘舊、更新近況」的意思。"},
{tab:'social',s:8,en:"I'll follow up with you by email.",zh:"我再寄信跟你聯繫。",tip:"商務場合收尾必備。"},
{tab:'social',s:8,en:"Can I grab your card?",zh:"方便給我一張名片嗎？",tip:"交換聯絡方式。"},
{tab:'social',s:8,en:"Let me get your contact — I'd love to stay in touch.",zh:"給我個聯絡方式吧，想保持聯繫。",tip:"比單純換名片更有溫度。"},
{tab:'social',s:8,en:"Let me introduce you to [Name] — you two should meet.",zh:"我介紹你認識＿＿，你們應該認識一下。",tip:"[[最高級的收尾：]]把人推出去，替他創造價值。"},
{tab:'social',s:8,en:"Enjoy the rest of the event!",zh:"祝你接下來的活動愉快！",tip:"活動場合通用。"},
{tab:'social',s:8,en:"Take care — talk soon.",zh:"保重，再聊。",tip:"收尾最後一句。"},

{tab:'social',s:9,en:"Can everyone hear me okay?",zh:"大家都聽得到嗎？",tip:"開場確認。"},
{tab:'social',s:9,en:"Looks like we're just waiting on one more.",zh:"看起來還差一位。",tip:"等待時的暖場。"},
{tab:'social',s:9,en:"How's the weather over there?",zh:"你那邊天氣如何？",tip:"跨國視訊的自然話題。"},
{tab:'social',s:9,en:"Sorry, you froze for a second there.",zh:"抱歉，你剛畫面停了一下。",tip:"技術狀況的道地說法。"},
{tab:'social',s:9,en:"I'll share my screen now.",zh:"我現在分享畫面。",tip:"從閒聊切進正題。"},
{tab:'social',s:9,en:"Let's pick this up where we left off.",zh:"我們從上次停的地方接續。",tip:"第二次會議開場。"},
{tab:'social',s:9,en:"Before we hang up — anything else?",zh:"掛電話前，還有別的嗎？",tip:"電話收尾。"},
{tab:'social',s:9,en:"Thanks for taking the call.",zh:"謝謝你接這通電話。",tip:"接到陌生來電之後的禮貌。"},
{tab:'social',s:9,en:"I'll send a quick recap after this.",zh:"會後我寄一份重點整理。",tip:"顯得可靠。"},
{tab:'social',s:9,en:"Thanks for your time — appreciate it.",zh:"謝謝你的時間，很感謝。",tip:"遠距收尾最穩的一句。"},

/* ── 多益商務 ── */
{tab:'toeic',s:0,en:"I'll get back to you by the end of the day.",zh:"我今天下班前回覆你。",tip:"[[高頻：]] get back to you＝回覆某人。多益常以「何時回覆」出題。"},
{tab:'toeic',s:0,en:"Could you cc me on that email?",zh:"可以把我副本進那封信嗎？",tip:"[[考點：]] cc＝副本（carbon copy），bcc＝密件副本。"},
{tab:'toeic',s:0,en:"The meeting has been pushed back to 3 p.m.",zh:"會議延到下午三點。",tip:"[[考點：]] push back＝延後；move up＝提前。方向別記反。"},
{tab:'toeic',s:0,en:"I'm out of the office until Monday.",zh:"我週一前不在辦公室。",tip:"[[考點：]] 自動回覆信件的常見句，多益閱讀愛考。"},
{tab:'toeic',s:0,en:"Let's touch base tomorrow morning.",zh:"我們明早再碰一下。",tip:"[[高頻片語：]] touch base with someone＝短暫聯繫、對一下進度。"},
{tab:'toeic',s:0,en:"Can you walk me through the process?",zh:"你可以帶我跑一遍流程嗎？",tip:"[[高頻：]] walk someone through＝一步步說明。常與 procedure 一起出現。"},
{tab:'toeic',s:0,en:"I'll loop in the design team on this.",zh:"我會把設計團隊拉進來一起看。",tip:"[[高頻：]] loop in＝把某人納入溝通。同義替換常出 involve／include。"},
{tab:'toeic',s:0,en:"She's on another line right now.",zh:"她正在講另一通電話。",tip:"[[考點：]] on another line＝通話中。電話情境必背。"},
{tab:'toeic',s:0,en:"Please hold off on that until further notice.",zh:"那件事請暫緩，等候進一步通知。",tip:"[[考點：]] hold off＝暫緩；until further notice＝等候通知。"},
{tab:'toeic',s:0,en:"We're on a tight deadline.",zh:"我們的期限很緊。",tip:"[[考點：]] tight deadline／meet the deadline／extend the deadline，三個常一起考。"},

{tab:'toeic',s:1,en:"Let's go over the agenda first.",zh:"我們先過一下議程。",tip:"[[考點：]] go over＝逐項檢視；agenda 是必背字。"},
{tab:'toeic',s:1,en:"Can we circle back to that later?",zh:"那點可以稍後再回來談嗎？",tip:"[[高頻片語：]] circle back＝回頭再談。同義替換是 revisit。"},
{tab:'toeic',s:1,en:"I'd like to add one more item to the agenda.",zh:"我想在議程上再加一項。",tip:"[[考點：]] item＝議程項目，也出現在訂單情境，注意一詞多義。"},
{tab:'toeic',s:1,en:"Just to make sure we're on the same page —",zh:"先確認一下我們認知一致——",tip:"[[高頻片語：]] on the same page＝有共識。多益聽力很常出現。"},
{tab:'toeic',s:1,en:"Could you elaborate on that point?",zh:"可以就這點再說明一下嗎？",tip:"[[考點：]] elaborate on＝詳述。選項常替換成 explain further。"},
{tab:'toeic',s:1,en:"Let's table this for now.",zh:"這個我們先擱置。",tip:"[[必考陷阱：]] 美式＝擱置、英式＝列入議程，意思完全相反，看上下文判斷。"},
{tab:'toeic',s:1,en:"We're running out of time.",zh:"我們時間快不夠了。",tip:"[[考點：]] run out of＝用盡。常與 time／budget／stock 搭配。"},
{tab:'toeic',s:1,en:"Let's take this offline.",zh:"這個我們會後私下談。",tip:"[[考點：]] take it offline＝不在會中討論。字面看不出意思，要背。"},
{tab:'toeic',s:1,en:"To sum up, we've agreed on three points.",zh:"總結一下，我們達成三點共識。",tip:"[[考點：]] sum up＝總結。常接 reach／agree on an agreement。"},
{tab:'toeic',s:1,en:"I'll send the minutes right after the meeting.",zh:"會後我馬上寄會議紀錄。",tip:"[[考點：]] minutes＝會議紀錄（複數）。這是多益經典陷阱字。"},

{tab:'toeic',s:2,en:"I'll have someone pick you up at the airport.",zh:"我會派人到機場接你。",tip:"[[考點：]] pick up＝接人；也可指「取貨」，一詞多義。"},
{tab:'toeic',s:2,en:"Would Tuesday afternoon work for you?",zh:"週二下午你方便嗎？",tip:"[[考點：]] work for someone＝對某人方便。商務約時間的萬用句。"},
{tab:'toeic',s:2,en:"I'll arrange a tour of the facility.",zh:"我會安排參觀廠區。",tip:"[[高頻字：]] facility＝設施、廠區。多益閱讀常出現。"},
{tab:'toeic',s:2,en:"Please let us know if there's anything we can do.",zh:"有任何我們能做的，請告訴我們。",tip:"[[考點：]] 商務書信的標準客套句，常在閱讀測驗出現。"},
{tab:'toeic',s:2,en:"We'd be happy to extend the warranty.",zh:"我們樂意延長保固。",tip:"[[必背字：]] warranty＝保固。與 guarantee 意思接近但用法不同。"},
{tab:'toeic',s:2,en:"I'll get you a quote by Friday.",zh:"我週五前給你報價。",tip:"[[考點：]] quote／quotation＝報價單；estimate＝估價。"},
{tab:'toeic',s:2,en:"Thank you for considering our proposal.",zh:"謝謝你考慮我們的提案。",tip:"[[考點：]] proposal 常與 submit／review／accept 搭配出題。"},
{tab:'toeic',s:2,en:"We look forward to a long-term partnership.",zh:"期待長期合作。",tip:"[[文法考點：]] look forward to 後面接名詞或 V-ing，不接原形動詞。"},
{tab:'toeic',s:2,en:"I'll follow up on our discussion next week.",zh:"下週我會就我們談的內容跟進。",tip:"[[高頻：]] follow up on＝就某事跟進。名詞寫法是 follow-up。"},
{tab:'toeic',s:2,en:"Let me introduce our sales manager, Ms. Chen.",zh:"讓我介紹我們的業務經理陳小姐。",tip:"[[考點：]] 職稱加姓氏的介紹順序，聽力常考「誰是誰」。"},

{tab:'toeic',s:3,en:"I'd like to book a round-trip ticket to Singapore.",zh:"我想訂一張往新加坡的來回票。",tip:"[[考點：]] round-trip＝來回；one-way＝單程。"},
{tab:'toeic',s:3,en:"Could I get an aisle seat, please?",zh:"可以給我靠走道的位子嗎？",tip:"[[考點：]] aisle＝走道，發音像「艾歐」，s 不發音；window seat＝靠窗。"},
{tab:'toeic',s:3,en:"Is breakfast included in the rate?",zh:"房價有含早餐嗎？",tip:"[[考點：]] rate＝房價、費率。included／complimentary 都常出。"},
{tab:'toeic',s:3,en:"I need to change my reservation.",zh:"我要更改訂位。",tip:"[[考點：]] reservation＝訂位；reschedule＝改期。"},
{tab:'toeic',s:3,en:"What time is check-out?",zh:"幾點退房？",tip:"[[考點：]] check-in／check-out 是住宿情境必考。"},
{tab:'toeic',s:3,en:"Could you call me a taxi, please?",zh:"可以幫我叫計程車嗎？",tip:"[[考點：]] 飯店服務句型，常出現在 Part 2 應答。"},
{tab:'toeic',s:3,en:"The flight has been delayed by two hours.",zh:"班機延誤兩小時。",tip:"[[考點：]] delayed／postponed／cancelled 三個狀態常一起考。"},
{tab:'toeic',s:3,en:"I'd like to extend my stay by one night.",zh:"我想多住一晚。",tip:"[[考點：]] extend by＝延長多久；extend to＝延長到某時點。"},
{tab:'toeic',s:3,en:"Do you offer a corporate rate?",zh:"你們有企業優惠價嗎？",tip:"[[考點：]] corporate＝企業的。corporate account／corporate rate 常出。"},
{tab:'toeic',s:3,en:"I'll need a receipt for reimbursement.",zh:"我需要收據來報帳。",tip:"[[必背字：]] reimbursement＝報帳、核銷。多益超高頻。"},

{tab:'toeic',s:4,en:"We'd like to place a bulk order.",zh:"我們想下一筆大量訂單。",tip:"[[考點：]] place an order＝下單；bulk＝大量。"},
{tab:'toeic',s:4,en:"Could you send us a sample first?",zh:"可以先寄樣品給我們嗎？",tip:"[[考點：]] sample＝樣品，選項常替換成 specimen。"},
{tab:'toeic',s:4,en:"The shipment is scheduled for next Monday.",zh:"這批貨預計下週一出貨。",tip:"[[文法考點：]] be scheduled for＋時間／be scheduled to＋動詞。"},
{tab:'toeic',s:4,en:"Your order is currently out of stock.",zh:"你的訂單目前缺貨。",tip:"[[考點：]] out of stock＝缺貨；in stock＝有現貨。反義對比常出。"},
{tab:'toeic',s:4,en:"We can offer a 10% discount on orders over 500 units.",zh:"500 件以上的訂單可給九折。",tip:"[[考點：]] discount on＋商品。數字與條件是解題關鍵。"},
{tab:'toeic',s:4,en:"Please confirm the quantity and specifications.",zh:"請確認數量與規格。",tip:"[[必背字：]] specifications＝規格，常縮寫成 spec。"},
{tab:'toeic',s:4,en:"The lead time is approximately three weeks.",zh:"交期大約三週。",tip:"[[必背字：]] lead time＝從下單到交貨的時間。多益高頻。"},
{tab:'toeic',s:4,en:"There's been a delay in production.",zh:"生產有延誤。",tip:"[[考點：]] delay in＋名詞。多益愛問「延誤的原因是什麼」。"},
{tab:'toeic',s:4,en:"We'll cover the shipping costs.",zh:"運費由我們負擔。",tip:"[[考點：]] cover＝負擔費用，選項常替換成 bear／absorb。"},
{tab:'toeic',s:4,en:"I'm attaching the invoice to this email.",zh:"我把發票附在這封信裡。",tip:"[[必背字：]] invoice＝發票、請款單；receipt＝收據。兩者不同。"},

{tab:'toeic',s:5,en:"I'm sorry for the inconvenience.",zh:"造成不便，很抱歉。",tip:"[[考點：]] inconvenience 是客服情境的必備字。"},
{tab:'toeic',s:5,en:"Could you give me your order number?",zh:"可以給我你的訂單編號嗎？",tip:"[[考點：]] 客服第一步行動，Part 3 常考「他為什麼問這個」。"},

/* 每句指定穩定音檔編號：社交 social-001…100、多益 toeic-001…100 */
(function(){ const n={}; DATA.forEach(d=>{ n[d.tab]=(n[d.tab]||0)+1; d.aid=d.tab+'-'+String(n[d.tab]).padStart(3,'0'); }); })();

/* ?all=1 → 一次輸出兩區全部內容，供列印／存 PDF 用 */
const PRINT_ALL = new URLSearchParams(location.search).get('all')==='1';
const KEY='st-fav-v1', QKEY='st-quiz-v1', TKEY='st-theme-v1';
let favs=[]; try{ favs=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ favs=[]; }
let tab='social', scene='all', onlyFav=false, kw='', quiz=false;
try{ quiz = localStorage.getItem(QKEY)==='1'; }catch(e){}

const main=document.getElementById('main');
const chipBox=document.getElementById('chips');
const meta=document.getElementById('meta');
const q=document.getElementById('q');
const clr=document.getElementById('clr');
const favBtn=document.getElementById('favBtn');
const favCnt=document.getElementById('favCnt');
const themeBtn=document.getElementById('themeBtn');
const quizBtn=document.getElementById('quizBtn');

const esc = s => s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const rich = s => esc(s).replace(/\[\[/g,'<b>').replace(/\]\]/g,'</b>');
function hl(s,k){
  const base = rich(s);
  if(!k) return base;
  try{ return base.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }
  catch(e){ return base; }
}

function buildChips(){
  const list = SCENES[tab];
  const html=[`<button class="chip ${scene==='all'?'on':''}" data-sc="all">全部</button>`,
              `<button class="chip ${scene==='lead'?'on':''}" data-sc="lead">重點提示</button>`];
  list.forEach((s,i)=>{
    const name = s.t.replace(/^場景[一二三四五六七八九十]+：/,'').replace(/^[一二三四五六七八九十]+、/,'');
    html.push(`<button class="chip ${scene===String(i)?'on':''}" data-sc="${i}">${i+1}. ${name}</button>`);
  });
  html.push(`<button class="chip ${scene==='tail'?'on':''}" data-sc="tail">${tab==='social'?'常踩的坑':'考前怎麼用'}</button>`);
  chipBox.innerHTML=html.join('');
  chipBox.querySelectorAll('.chip').forEach(c=>{
    c.onclick=()=>{
      scene=c.dataset.sc;
      if(scene!=='all'){ onlyFav=false; updateFavBtn(); }
      kw=''; q.value=''; clr.classList.remove('on');
      buildChips(); render();
      window.scrollTo({top:0,behavior:'smooth'});
    };
  });
}

function itemHTML(d){
  const on = favs.includes(d.en);
  return `<div class="item">
    <div class="top">
      <button class="say" data-aid="${d.aid}" data-en="${esc(d.en)}" title="朗讀">🔊</button>
      <div class="txt">
        <div class="en">${hl(d.en,kw)}</div>
        <div class="zh">${hl(d.zh,kw)}</div>
        ${d.tip?`<div class="tip">${hl(d.tip,kw)}</div>`:''}
      </div>
      <button class="star ${on?'on':''}" data-en="${esc(d.en)}" title="收藏">${on?'★':'☆'}</button>
    </div>
  </div>`;
}

const matches = d => {
  if(onlyFav && !favs.includes(d.en)) return false;
  if(!kw) return true;
  return (d.en+' '+d.zh+' '+d.tip).toLowerCase().includes(kw.toLowerCase());
};

function render(){
  if(PRINT_ALL){ renderAll(); return; }
  let html='', shown=0, total=0;

  if(kw){
    ['social','toeic'].forEach(t=>{
      const list = DATA.filter(d=>d.tab===t).filter(matches);
      if(!list.length) return;
      shown += list.length;
      html += `<h2>${TABNAME[t]}｜${list.length} 句</h2><div class="scene">${list.map(itemHTML).join('')}</div>`;
    });
    if(!html) html=`<div class="empty"><b>找不到「${esc(kw)}」</b>換個關鍵字，或按「全部」回到完整清單。</div>`;
    main.innerHTML=html;
    meta.textContent = `搜尋「${kw}」共 ${shown} 句（兩區一起找）`;
    applyQuiz(); bindItems();
    return;
  }

  const list = SCENES[tab];

  if(scene==='lead'){
    main.innerHTML = LEAD[tab];
    meta.textContent = `${TABNAME[tab]}｜重點提示`;
    applyQuiz(); bindItems(); return;
  }
  if(scene==='tail'){
    main.innerHTML = TAIL[tab];
    meta.textContent = `${TABNAME[tab]}｜${tab==='social'?'常踩的坑':'考前怎麼用'}`;
    applyQuiz(); bindItems(); return;
  }

  if(scene==='all'){
    html += `<h2>${tab==='social'?'先記這個：Small Talk 的三步公式':'目標與練法'}</h2>` + LEAD[tab];
    list.forEach((s,i)=>{
      const items = DATA.filter(d=>d.tab===tab && d.s===i).filter(matches);
      if(!items.length && onlyFav) return;
      html += `<h2>${s.t}</h2><p class="note">${s.note}</p>`;
      html += `<div class="scene">${items.length?items.map(itemHTML).join(''):'<div class="empty">這區沒有符合的句子</div>'}</div>`;
      shown += items.length;
      total += DATA.filter(d=>d.tab===tab && d.s===i).length;
    });
    html += TAIL[tab];
  } else {
    const i=parseInt(scene,10), s=list[i];
    const items = DATA.filter(d=>d.tab===tab && d.s===i).filter(matches);
    html += `<h2>${s.t}</h2><p class="note">${s.note}</p>`;
    html += `<div class="scene">${items.length?items.map(itemHTML).join(''):'<div class="empty"><b>沒有符合的句子</b>換個關鍵字試試</div>'}</div>`;
    shown=items.length;
    total=DATA.filter(d=>d.tab===tab && d.s===i).length;
  }

  main.innerHTML=html;
  meta.textContent = `顯示 ${shown} 句${onlyFav?'（僅收藏）':''}｜${TABNAME[tab]}共 ${total} 句・全站 ${DATA.length} 句`;
  applyQuiz(); bindItems();
}

function renderAll(){
  let html='', n=0;
  ['social','toeic'].forEach((t,ti)=>{
    const second = ti>0;
    const c = second? '#2f6f6b' : '#8a5a2b';
    html += `<h2 style="margin-top:${second?'54px':'30px'};border-left-color:${c};font-size:22px">${TABNAME[t]}　共 100 句</h2>`;
    html += LEAD[t];
    SCENES[t].forEach((s,i)=>{
      const items = DATA.filter(d=>d.tab===t && d.s===i);
      n += items.length;
      html += `<h2>${s.t}</h2><p class="note">${s.note}</p>`;
      html += `<div class="scene">${items.map(itemHTML).join('')}</div>`;
    });
    html += TAIL[t];
  });
  main.innerHTML = html;
  meta.textContent = `完整列印版｜兩區共 ${n} 句`;
  bindItems();
}

function applyQuiz(){
  document.body.classList.toggle('quiz', quiz);
  quizBtn.classList.toggle('on', quiz);
}
quizBtn.onclick=()=>{
  quiz=!quiz;
  try{ localStorage.setItem(QKEY, quiz?'1':'0'); }catch(e){}
  if(quiz) main.querySelectorAll('.item.open').forEach(x=>x.classList.remove('open'));
  applyQuiz();
  if(quiz) bindItems();
};

function bindItems(){
  main.querySelectorAll('.say').forEach(b=>{ b.onclick=()=>speak(b.dataset.aid, b.dataset.en, b); });
  main.querySelectorAll('.star').forEach(b=>{
    b.onclick=()=>{
      const v=b.dataset.en, i=favs.indexOf(v);
      if(i>=0) favs.splice(i,1); else favs.push(v);
      try{ localStorage.setItem(KEY,JSON.stringify(favs)); }catch(e){}
      updateFavBtn(); render();
    };
  });
  if(quiz){
    main.querySelectorAll('.item').forEach(it=>{
      const t=it.querySelector('.txt');
      if(t) t.onclick=()=>it.classList.toggle('open');
    });
  }
}

/* ── 朗讀：播放預先生成的高品質語音檔；載不到才退回裝置內建語音 ── */
const VKEY='st-voice-v1', RKEY='st-rate-v1';
let voiceKey='us-f', rate=1;
try{ const v=localStorage.getItem(VKEY); if(v) voiceKey=v; }catch(e){}
try{ const r=parseFloat(localStorage.getItem(RKEY)); if(r>0) rate=r; }catch(e){}

const audioEl=new Audio();
audioEl.preload='none';
let curBtn=null;

function isSay(b){ return b && b.classList.contains('say'); }
function resetBtn(b){ if(!b) return; b.classList.remove('playing'); if(isSay(b)) b.textContent='🔊'; }
function stopPlaying(){
  try{ audioEl.pause(); }catch(e){}
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  resetBtn(curBtn); curBtn=null;
}

/* 後備方案：裝置內建語音，並優先挑自然度較高的英語語音 */
function sayFallback(text,btn){
  if(!text || !('speechSynthesis' in window)){ btn.disabled=true; btn.textContent='✕'; return; }
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=rate;
  const vs=(speechSynthesis.getVoices()||[]);
  const prefer=['Google US English','Google UK English Female','Samantha','Ava','Allison','Serena','Daniel','Karen','Alex'];
  let pick=null;
  for(const n of prefer){ pick=vs.find(v=>v.name===n); if(pick) break; }
  if(!pick) pick=vs.find(v=>v.lang==='en-US')||vs.find(v=>/^en/i.test(v.lang));
  if(pick) u.voice=pick;
  curBtn=btn; btn.classList.add('playing'); if(isSay(btn)) btn.textContent='■';
  const done=()=>{ resetBtn(btn); if(curBtn===btn) curBtn=null; };
  /* 保險計時器：萬一語音引擎不回報結束，按鈕也不會卡在播放狀態 */
  const wd=setTimeout(done, Math.min(30000, 1800 + text.length*90));
  u.onend=()=>{ clearTimeout(wd); done(); };
  u.onerror=()=>{ clearTimeout(wd); done(); };
  speechSynthesis.speak(u);
}

function speak(aid,text,btn){
  if(curBtn===btn){ stopPlaying(); return; }
  stopPlaying();
  curBtn=btn; btn.classList.add('playing'); if(isSay(btn)) btn.textContent='■';
  const done=()=>{ resetBtn(btn); if(curBtn===btn) curBtn=null; };
  let failed=false;
  const fail=()=>{ if(failed) return; failed=true; try{ audioEl.pause(); }catch(e){} done(); sayFallback(text,btn); };
  audioEl.onended=done;
  audioEl.onerror=fail;
  /* 順序要緊：指定 src 會把播放速率重設回 1，所以一定要在 src 之後才設定 */
  audioEl.src='audio/'+voiceKey+'/'+aid+'.mp3';
  audioEl.defaultPlaybackRate=rate;
  audioEl.playbackRate=rate;
  const p=audioEl.play();
  if(p && p.catch) p.catch(fail);
}
window.addEventListener('beforeunload',()=>{
  try{ audioEl.pause(); }catch(e){}
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
});
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    if(tab===t.dataset.tab) return;
    tab=t.dataset.tab;
    scene='all'; kw=''; q.value=''; clr.classList.remove('on');
    document.body.dataset.tab=tab;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.tab===tab));
    buildChips(); render();
    window.scrollTo({top:0,behavior:'smooth'});
  };
});

function updateFavBtn(){
  favBtn.classList.toggle('on',onlyFav);
  favCnt.textContent = favs.length? ` ${favs.length}` : '';
}
favBtn.onclick=()=>{ onlyFav=!onlyFav; updateFavBtn(); render(); };

q.addEventListener('input',()=>{
  kw=q.value.trim();
  clr.classList.toggle('on',!!kw);
  if(kw){ onlyFav=false; updateFavBtn(); }
  render();
});
clr.onclick=()=>{ q.value=''; kw=''; clr.classList.remove('on'); render(); q.focus(); };

document.getElementById('printBtn').onclick=()=>window.print();

themeBtn.onclick=()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark){ document.documentElement.removeAttribute('data-theme'); themeBtn.textContent='🌙 夜間'; try{localStorage.setItem(TKEY,'light');}catch(e){} }
  else{ document.documentElement.setAttribute('data-theme','dark'); themeBtn.textContent='☀️ 日間'; try{localStorage.setItem(TKEY,'dark');}catch(e){} }
};
try{
  if(localStorage.getItem(TKEY)==='dark'){
    document.documentElement.setAttribute('data-theme','dark'); themeBtn.textContent='☀️ 日間';
  }
}catch(e){}

buildChips(); updateFavBtn(); applyQuiz(); render();

/* 語音與語速選擇 */
const voiceSel=document.getElementById('voiceSel');
const rateSel=document.getElementById('rateSel');
const tryBtn=document.getElementById('tryBtn');
voiceSel.value=voiceKey; rateSel.value=String(rate);
voiceSel.onchange=()=>{
  voiceKey=voiceSel.value;
  try{ localStorage.setItem(VKEY,voiceKey); }catch(e){}
  stopPlaying();
};
rateSel.onchange=()=>{
  rate=parseFloat(rateSel.value)||1;
  try{ localStorage.setItem(RKEY,String(rate)); }catch(e){}
  audioEl.defaultPlaybackRate=rate;
  audioEl.playbackRate=rate;
  stopPlaying();
};
tryBtn.onclick=()=>{
  const b=main.querySelector('.say');
  if(b){ speak(b.dataset.aid, b.dataset.en, tryBtn); return; }
  const f=DATA.find(d=>d.tab===tab)||DATA[0];
  speak(f.aid, f.en, tryBtn);
};
